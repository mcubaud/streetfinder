<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Street Finder Reverse Game</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <link rel="stylesheet" href="balades.css"/>
    <style>
        #recherche_inv{
            display: flex;
            justify-content: space-evenly;
            margin-top: 5px;
            align-items: center;
            background-color: #dbdbdb;
        }

        .clignoter_vert {
            animation: clignoter_vert 500ms linear;
        }
        .secouer_petit_orange {
            animation: secouer_petit_orange 1s linear;
        }
        .secouer_petit {
            animation: secouer_petit 1s linear;
        }
        @keyframes clignoter_vert {
            0% { background-color: white; }
            50% { background-color: green; }
            100% { background-color: white; }
        }
        @keyframes secouer_petit_orange {
            0% { transform: translateX(0); color: orange;}
            25% { transform: translateX(-5px); color: black;}
            75% { transform: translateX(5px); color: orange;}
            100% { transform: translateX(0); color: black;}
        }
        @keyframes secouer_petit {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
            100% { transform: translateX(0); }
        }

        #div_found{
            height: 200px;
            background-color: black;
            text-shadow: 1px 1px 3px white;
            border: red;
            border-width: 10px;
            border-radius: 10px;
            margin: 0px 15px 15px 15px;
        }
        #list_found{
            height: 80%;
            margin:0px;
            overflow: auto;
        }

        #list_found li{
            cursor: pointer;
        }
        #div_not_found{
            height: 200px;
            background-color: black;
            text-shadow: 1px 1px 3px white;
            border: red;
            border-width: 10px;
            border-radius: 10px;
            margin: 0px 15px 15px 15px;
        }
        #list_not_found{
            height:80%;
            margin:0px;
            overflow: auto;
        }

        #list_not_found li{
            cursor: pointer;
        }

        #div_settings{
            width: 70%;
            height: 70%;
            left: 15%;
            top: 15%;
            background-image: linear-gradient(white, gray);
            z-index: 1000000;
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            border: 1px solid black;
            border-radius: 30px;
            transition: width 2s, height 2s;
        }

        #remaining_time{
            background-color: white;
            border: 1px solid;
            border-radius: 5px;
            text-shadow: black 1px 1px 1px;
        }
    </style>
</head>
<body>
    <header>
        <div id="haut_gauche">
          <!--<button id="localize"></button>-->
          <button id="settings" style="width:30px; height: 30px; background-image: url('https://upload.wikimedia.org/wikipedia/commons/f/fe/Gear-icon-white-background.png'); background-size: 30px;"></button>
        </div>
        <div id='titre'>
        <h1>Retrouver les rues de </h1>
        <h1 style="color: black;"> &#128269</h1>
        <h1> (inverse)</h1>
        </div>
        <div id="boutons">
        <progress id="file" max="100" value="0">0%</progress>
          <p id="score">0 % des rues trouvées</p>
        </div>
    </header>
    <div id="ecran_du_jeu">
        <div id="mapid"></div>
        <div id="container_of_list_of_street">
            <div id="div_found">
                <h3 style="color:white;">Rues trouvées</h3>
                <ul id="list_found"></ul>
            </div>
            <div id="div_not_found">
                <h3 style="color:white;">Rues pas trouvées</h3>
                <ul id="list_not_found"></ul>
            </div>
            <button id="save">Sauvegarder ma progression</button>
            <label for="upload">Charger une sauvegarde:</label>
            <input type="file" name="upload" id="upload" accept=".json"/>
        </div>
    </div>
    <div id="recherche_inv">
        <p id="target_street"></p>
        <p id="remaining_attempts">3 remaining attempts</p>
        <p id="remaining_time"></p>
        <button id="passer">Passer</button>
    </div>

    <audio id="bad_bip" src="https://universal-soundbank.com/sounds/2042.mp3"></audio>
    <audio id="very_bad_bip" src="https://universal-soundbank.com/sounds/1315.mp3"></audio>
    <audio id="good_bip" src="https://universal-soundbank.com/sounds/4063.mp3"></audio>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        
        
        // --- CONSTANTES REGEX (compilées une fois) ---
        var REGEX_RUES = /\brue |\bavenue |\bboulevard |\bcours |\bplace |\bimpasse |\ballée |\bruelle |\bpassage |\bpont |\bmontée |\bquai |\btunnel |\bgrande rue |\bmontee |\ballee |\bbretelle |\bmail |\bcite |\banse |\bcarrefour |\bchaussee |\bchemin |\bclos |\bcote |\bcour |\bcours |\bdegre |\bdescente |\bdreve |\bescoussiere |\besplanade |\bgaffe |\bgrand route |\bliaison |\bplacette |\bpromenade |\bresidence |\brang |\brampe |\brond point |\broute |\bruelle |\bsente |\bsentier |\bsquare |\btraverse |\bvenelle |\bvoie |\bberge |\bdigue |\bpasserelle |\bvilla /g;
        var REGEX_STOP_WORDS = /\ble |\bla |\bl' |\bles |\bde |\bdu |\bdes |\bd' |\bun |\bune |\bl |\bd /g;
        var REGEX_MILITARY = /\bamiral |\bcaporal |\blieutenant |\bcapitaine |\bmajor |\bgénéral |\bgeneral |\bcolonel |\bmarechal |\blieutenant colonel |\bsergent |\bsergent chef |\badjudant |\bsous lieutenant |\bcommandant |\bpresident /g;
        // --- PARAMÈTRES & ÉTAT DU JEU ---
        var lieu = localStorage.getItem("lieu") || "Rennes";
        var CITIES_CONFIG = {};
        var config = null;
        
        var initialAttempts = parseInt(localStorage.getItem("initial_attempts")) || 3;
        let attemptsLeft = initialAttempts;
        
        var mode = localStorage.getItem("mode") || "par_distance_au_centre_predefini";
        var timerType = localStorage.getItem("timer_type") || "local";
        
        let initialTime = localStorage.getItem("duree_chrono");
        if (!initialTime) {
            if (timerType === "local") initialTime = 30;
            else if (timerType === "global") initialTime = 3600;
            else initialTime = "illimité";
        }
        let time = initialTime;
        let timer = null;
        
        var roadsMultiColors = localStorage.getItem("roads_multi_colors") !== "false";
        var roadsWidth = parseFloat(localStorage.getItem("roads_width")) || 4.1;
        
        let totalLength = 0;
        let findLength = 0;
        let notFindLength = 0;
        
        var polylines = {};
        var names = {};
        var trouves = {};
        var trouvesUniques = [];
        let currentStreetIndex = 0;
        let targetStreetName = "";
        
        // --- INITIALISATION DE LA CARTE ---
        console.log(lieu);;
        document.title += ` ${lieu}`;
        
        var mymap = L.map('mapid')
        
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}.png?key=cb1_3our_1_ff49ad376f6ec9bfd85eb768', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>, &copy; <a href="https://carto.com/attributions">CARTO</a>'
        }).addTo(mymap);
        
        // --- CHARGEMENT ET DÉMARRAGE ---
        async function initGame() {
            try {

                const citiesResponse = await fetch("cities.json");
                CITIES_CONFIG = await citiesResponse.json();
                config = CITIES_CONFIG[lieu] || CITIES_CONFIG["Rennes"];
                mymap.setView(config.coords, config.zoom);
                document.getElementById("titre").children[0].innerHTML += config.nom
                
                var response = await fetch(config.file);
                var data = await response.json();
                let array = sortStreet(data.features, mode);
        
                array.forEach((obj, i) => {
                    var lnglats = obj.geometry.coordinates;
                    var latlngs = config.inv_lonlat 
                        ? (obj.geometry.type === "MultiLineString" 
                            ? lnglats.map(y => y.map(x => [x[1], x[0]])) 
                            : lnglats.map(x => [x[1], x[0]]))
                        : lnglats;
        
                    let rd = 0;
                    if (roadsMultiColors) {
                        rd = Math.floor(Math.min(1.5 * obj.properties.name.length, 180));
                    }
                    var color = rgbToHex(59 + rd, 54 + rd, 75 + rd);
                    var polyline = L.polyline(latlngs, { color: color, weight: roadsWidth }).addTo(mymap);
        
                    polyline.nom = obj.properties.name;
                    polyline.i = i;
                    polyline.length = obj.properties.length || 0;
        
                    var otherTags = obj.properties.other_tags;
                    if (otherTags && otherTags.includes('"wikipedia"=>"')) {
                        polyline.wiki = otherTags.split('"wikipedia"=>"')[1].split('"')[0];
                    }
        
                    totalLength += polyline.length;
        
                    if (polyline._path) {
                        polyline._path.nom = polyline.nom;
                        polyline._path.i = i;
                        polyline._path.onclick = checkClickedStreet;
                    }
        
                    polylines[i] = polyline;
                    names[i] = obj.properties.name;
                    trouves[i] = false;
                });
        
                askNextStreet();
                if (timerType === "global") {
                    launchTimer();
                }
            } catch (err) {
                console.error("Erreur d'initialisation des données :", err);
            }
        }
        
        initGame();
        
        // --- LOGIQUE DU JEU ---
        function sortStreet(array, mode) {
            if (mode === "par_distance_au_centre") {
                let sumX = 0, sumY = 0;
                array.forEach(item => {
                    sumX += item.geometry.coordinates[0][0];
                    sumY += item.geometry.coordinates[0][1];
                });
                var centerX = sumX / array.length;
                var centerY = sumY / array.length;
        
                array.forEach(item => {
                    item.distance = Math.sqrt((item.geometry.coordinates[0][0] - centerX) ** 2 + (item.geometry.coordinates[0][1] - centerY) ** 2);
                });
                return array.sort((a, b) => a.distance - b.distance);
            }
            
            if (mode === "par_distance_au_centre_predefini" && typeof centre !== "undefined") {
                array.forEach(item => {
                    item.distance = Math.sqrt((item.geometry.coordinates[0][0] - centre[1]) ** 2 + (item.geometry.coordinates[0][1] - centre[0]) ** 2);
                });
                return array.sort((a, b) => a.distance - b.distance);
            }
            
            if (mode === "par_taille_des_segments") {
                return array.sort((a, b) => (b.properties.length || 0) - (a.properties.length || 0));
            }
            
            if (mode === "par_longueur_totale") {
                var lengthMap = {};
                array.forEach(item => {
                    var name = item.properties.name;
                    lengthMap[name] = (lengthMap[name] || 0) + (item.properties.length || 0);
                });
                array.forEach(item => item.longueur = lengthMap[item.properties.name]);
                return array.sort((a, b) => b.longueur - a.longueur);
            }
            
            if (mode === "random") {
                return array.sort(() => Math.random() - 0.5);
            }
        
            return array;
        }
        
        function askNextStreet() {
            var totalStreets = Object.keys(names).length;
            if (currentStreetIndex < totalStreets) {
                targetStreetName = names[currentStreetIndex];
        
                if (trouvesUniques.includes(targetStreetName)) {
                    currentStreetIndex++;
                    askNextStreet();
                    return;
                }
        
                printScore();
                document.getElementById("target_street").innerHTML = `<b>Rue à trouver </b>: ${targetStreetName}`;
                attemptsLeft = initialAttempts;
                document.getElementById("remaining_attempts").innerHTML = `${attemptsLeft} tentatives restantes`;
        
                if (timerType === "local") {
                    launchTimer();
                }
                currentStreetIndex++;
            } else {
                alert("Bravo ! Vous avez trouvé toutes les rues !");
                printScore();
            }
        }
        
        function checkClickedStreet(e) {
            var polyline = e.target;
            var clickedName = polyline.nom;
        
            if (areSimilar(targetStreetName, clickedName)) {
                trouves[polyline.i] = true;
                colorRoads(targetStreetName, "green");
                document.getElementById("good_bip")?.play();
                askNextStreet();
            } else {
                attemptsLeft--;
                var attemptsElem = document.getElementById("remaining_attempts");
                attemptsElem.classList.add("secouer_petit_orange");
                setTimeout(() => attemptsElem.classList.remove("secouer_petit_orange"), 1000);
        
                if (attemptsLeft <= 0) {
                    colorRoads(targetStreetName, "red");
                    document.getElementById("very_bad_bip")?.play();
                    askNextStreet();
                } else {
                    document.getElementById("bad_bip")?.play();
                    attemptsElem.innerHTML = `${attemptsLeft} tentative${attemptsLeft > 1 ? "s" : ""} restante${attemptsLeft > 1 ? "s" : ""}`;
                }
            }
        }
        
        function colorRoads(name, color) {
            for (let i in polylines) {
                var currentName = names[i];
                if (areSimilar(name, currentName)) {
                    trouves[i] = true;
                    polylines[i].setStyle({ color: color });
                    polylines[i].bindTooltip(currentName);
        
                    if (polylines[i].wiki) {
                        var [langue, page] = polylines[i].wiki.split(":");
                        polylines[i].bindPopup(
                            `<iframe style='height:400px; width:800px; border:none;' src='https://${langue}.m.wikipedia.org/wiki/${page}'></iframe>`
                        );
                    }
        
                    if (color === "green") {
                        findLength += polylines[i].length;
                    } else {
                        notFindLength += polylines[i].length;
                    }
        
                    if (!trouvesUniques.includes(currentName)) {
                        if (color === "green") {
                            addInListFound(currentName, polylines[i]);
                        } else {
                            addInListNotFound(currentName, polylines[i]);
                        }
                    }
                }
            }
        }
        
        function launchTimer() {
            clearInterval(timer);
            time = initialTime;
        
            timer = setInterval(() => {
                time--;
                var timerElem = document.getElementById("remaining_time");
                if (timerElem) {
                    timerElem.innerHTML = `${time}s`;
                    timerElem.style.color = couleurParScore(time / initialTime);
                }
        
                if (time <= 0) {
                    clearInterval(timer);
                    if (timerType === "local") {
                        colorRoads(targetStreetName, "red");
                        document.getElementById("very_bad_bip")?.play();
                        askNextStreet();
                    } else if (timerType === "global") {
                        alert("Temps écoulé ! Perdu");
                        window.location.reload();
                    }
                }
            }, 1000);
        }
        
        document.getElementById("passer").onclick = () => {
            colorRoads(targetStreetName, "red");
            askNextStreet();
        };
        
        function printScore() {
            var askedLength = findLength + notFindLength;
            var scoreElem = document.getElementById("score");
        
            if (askedLength === 0) {
                scoreElem.innerHTML = `0 / 0 km (0%) des rues trouvées`;
                scoreElem.style.color = couleurParScore(0);
            } else {
                var ratio = findLength / askedLength;
                scoreElem.innerHTML = `${Math.round(findLength / 1000)} / ${Math.round(askedLength / 1000)} km (${Math.round(100 * ratio)}%) des rues trouvées`;
                scoreElem.style.color = couleurParScore(ratio);
            }
        }
        
        // --- PARSING & COMPARAISON DE TEXTE ---
        function standardize(str) {
            return str
                .toLowerCase()
                .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                .replace(/-/g, " ")
                .replace(/œ/g, "oe")
                .replace(/'/g, "' ");
        }
        
        function areSimilar(nom1, nom2) {
            var std1 = standardize(nom1);
            var std2 = standardize(nom2);
        
            var exactMatch = std1 === std2;
            var partialMatch = std1.replace(REGEX_STOP_WORDS, "") ===
                std2.replace(REGEX_RUES, "").replace(REGEX_STOP_WORDS, "").replace(REGEX_MILITARY, "");
        
            return Boolean(exactMatch || partialMatch);
        }
        
        function couleurParScore(pts) {
            if (pts < 0.5) {
                return rgbToHex(255, Math.floor(255 * 2 * pts), 0);
            }
            return rgbToHex(Math.floor(255 - 255 * (pts / 2)), 255, 0);
        }
        
        function componentToHex(c) {
            var hex = c.toString(16);
            return hex.length === 1 ? "0" + hex : hex;
        }
        
        function rgbToHex(r, g, b) {
            return `#${componentToHex(r)}${componentToHex(g)}${componentToHex(b)}`;
        }
        
        // --- GESTION DOM DES LISTES ---
        function addInListFound(name, thisPolyline) {
            var nameStd = standardize(name).replace(/' /g, "_").replace(/ /g, "_");
            var li = document.createElement("li");
            li.id = `list_found_${nameStd}`;
            li.textContent = name;
        
            li.onclick = () => {
                thisPolyline.openTooltip();
                thisPolyline.openPopup();
                var latLngs = thisPolyline.getLatLngs();
                if (latLngs.length > 0) mymap.panTo(latLngs[0]);
            };
        
            document.getElementById("list_found").appendChild(li);
            li.scrollIntoView();
            trouvesUniques.push(name);
        }
        
        function addInListNotFound(name, thisPolyline) {
            var nameStd = standardize(name).replace(/' /g, "_").replace(/ /g, "_");
            var li = document.createElement("li");
            li.id = `list_not_found_${nameStd}`;
            li.textContent = name;
        
            li.onclick = () => {
                thisPolyline.openTooltip();
                var latLngs = thisPolyline.getLatLngs();
                if (latLngs.length > 0) mymap.panTo(latLngs[0]);
            };
        
            document.getElementById("list_not_found").appendChild(li);
            li.scrollIntoView();
            trouvesUniques.push(name);
        }
        
        // --- SAUVEGARDE ET CHARGEMENT ---
        document.getElementById("save").onclick = () => {
            downloadObjectAsJson(trouves, `streetfinder_save_${lieu}`);
        };
        
        function uploadSave(savedTrouvees) {
            for (let i in polylines) {
                var currentName = names[i];
                if (savedTrouvees[i]) {
                    polylines[i].setStyle({ color: "green" });
                    polylines[i].bindTooltip(currentName);
        
                    if (polylines[i].wiki) {
                        var [langue, page] = polylines[i].wiki.split(":");
                        polylines[i].bindPopup(
                            `<iframe style='height:400px; width:100%; border:none;' src='https://${langue}.m.wikipedia.org/wiki/${page}'></iframe>`
                        );
                    }
        
                    if (!trouves[i]) {
                        findLength += polylines[i].length;
                        trouves[i] = true;
                    }
                    if (!trouvesUniques.includes(currentName)) {
                        addInListFound(currentName, polylines[i]);
                    }
                }
            }
            printScore();
        }
        
        document.getElementById("upload").onchange = function () {
            var file = this.files[0];
            if (!file) return;
            var urlfile = URL.createObjectURL(file);
            fetch(urlfile)
                .then(r => r.json())
                .then(uploadSave);
        };
        
        function downloadObjectAsJson(exportObj, exportName) {
            var dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportObj));
            var downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", `${exportName}.json`);
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }
        
        // --- MENU DE PARAMÈTRES ---
        document.getElementById("settings").onclick = function () {
            let divSettings = document.getElementById("div_settings");
            if (divSettings) {
                divSettings.remove();
                return;
            }
        
            // Construction dynamique des options de villes à partir du JSON
            const cityOptionsHtml = Object.keys(CITIES_CONFIG)
                .map(key => `<option value="${key}" ${lieu === key ? "selected" : ""}>${CITIES_CONFIG[key].nom}</option>`)
                .join("");
        
            divSettings = document.createElement("div");
            divSettings.id = "div_settings";
            divSettings.innerHTML = `
                <h2>Paramètres</h2>
                <div>
                    <div>
                        <label for="choix_lieu">Choix de la ville :</label>
                        <select name="choix_lieu" id="choix_lieu">
                            ${cityOptionsHtml}
                        </select>
                    </div>
                    <div>
                        <label for="asked_order">Ordre de demande des rues :</label>
                        <select name="asked_order" id="asked_order">
                            <option value="par_distance_au_centre_predefini" ${mode === "par_distance_au_centre_predefini" ? "selected" : ""}>Par distance à un centre prédéfini</option>
                            <option value="par_distance_au_centre" ${mode === "par_distance_au_centre" ? "selected" : ""}>Par distance à un centre calculé</option>
                            <option value="par_taille_des_segments" ${mode === "par_taille_des_segments" ? "selected" : ""}>Par taille des segments</option>
                            <option value="par_longueur_totale" ${mode === "par_longueur_totale" ? "selected" : ""}>Par longueur totale de la rue (lent)</option>
                            <option value="random" ${mode === "random" ? "selected" : ""}>Ordre aléatoire</option>
                        </select>
                    </div>
                    <div>
                        <label for="attempts_number_select">Nombre de tentatives :</label>
                        <input type="number" id="attempts_number_select" name="attempts_number_select" min="1" max="5" value="${initialAttempts}">
                    </div>
                    <div style="display: flex;">
                        <label for="roads_width">Largeur des traits des routes :</label>
                        <input type="number" id="roads_width" name="roads_width" min="3" max="7" step="0.1" value="${roadsWidth}">
                        <div id="road_exemple" style="background-color: black; height: auto; width: ${roadsWidth}px; margin-left: 10px;"></div>
                    </div>
                    <div>
                        <label for="roads_multi_colors">Colorier les routes de différentes couleurs :</label>
                        <input type="checkbox" id="roads_multi_colors" name="roads_multi_colors" ${roadsMultiColors ? "checked" : ""}>
                    </div>
                    <div>
                        <label for="timer_type">Type de chrono :</label>
                        <select name="timer_type" id="timer_type">
                            <option value="local" ${timerType === "local" ? "selected" : ""}>Temps limité par rue</option>
                            <option value="global" ${timerType === "global" ? "selected" : ""}>Temps limité pour toutes les rues</option>
                            <option value="no" ${timerType === "no" ? "selected" : ""}>Pas de temps limité</option>
                        </select>
                    </div>
                    <div id="div_duree_chrono" style="visibility:${timerType === "no" ? "hidden" : "visible"};">
                        <label for="duree_chrono">Durée du chrono (s):</label>
                        <input type="number" id="duree_chrono" name="duree_chrono" min="1" value="${initialTime === "illimité" ? 30 : initialTime}" step="1">
                    </div>
                </div>
                <div style="display: flex">
                    <button id="valider">Valider et relancer la partie</button>
                    <button id="revenir">Annuler et revenir à la partie</button>
                </div>
            `;
        
            document.body.appendChild(divSettings);
        
            document.getElementById("timer_type").onchange = function () {
                const val = this.value;
                const divChrono = document.getElementById("div_duree_chrono");
                const inputChrono = document.getElementById("duree_chrono");
        
                if (val === "no") {
                    divChrono.style.visibility = "hidden";
                } else if (val === "local") {
                    divChrono.style.visibility = "visible";
                    inputChrono.value = 30;
                    inputChrono.step = 1;
                } else if (val === "global") {
                    divChrono.style.visibility = "visible";
                    inputChrono.value = 3600;
                    inputChrono.step = 60;
                }
            };
        
            document.getElementById("roads_width").oninput = function () {
                document.getElementById("road_exemple").style.width = `${this.value}px`;
            };
        
            document.getElementById("revenir").onclick = () => divSettings.remove();
        
            document.getElementById("valider").onclick = () => {
                localStorage.setItem("lieu", document.getElementById("choix_lieu").value);
                localStorage.setItem("mode", document.getElementById("asked_order").value);
                localStorage.setItem("initial_attempts", document.getElementById("attempts_number_select").value);
                localStorage.setItem("timer_type", document.getElementById("timer_type").value);
                localStorage.setItem("duree_chrono", document.getElementById("duree_chrono").value);
                localStorage.setItem("roads_width", document.getElementById("roads_width").value);
                localStorage.setItem("roads_multi_colors", document.getElementById("roads_multi_colors").checked);
                window.location.reload();
            };
        };
    </script>
</body>
</html>
